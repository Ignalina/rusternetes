[package]
name = "rusternetes"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "All-in-one Kubernetes in a single binary"

[[bin]]
name = "rusternetes"
path = "src/main.rs"

[features]
default = ["sqlite"]
sqlite = [
    "rusternetes-storage/sqlite",
    "rusternetes-api-server/sqlite",
    "rusternetes-scheduler/sqlite",
    "rusternetes-controller-manager/sqlite",
    "rusternetes-kubelet/sqlite",
    "rusternetes-kube-proxy/sqlite",
]
redis = [
    "rusternetes-storage/redis",
    "rusternetes-api-server/redis",
    "rusternetes-scheduler/redis",
    "rusternetes-controller-manager/redis",
    "rusternetes-kubelet/redis",
    "rusternetes-kube-proxy/redis",
]
redb = [
    "rusternetes-storage/redb",
    "rusternetes-api-server/redb",
    "rusternetes-scheduler/redb",
    "rusternetes-controller-manager/redb",
    "rusternetes-kubelet/redb",
    "rusternetes-kube-proxy/redb",
    "dep:tunnr-etcd",
]
# Daemonless youki container backend for the embedded kubelet (Linux, root,
# cgroup v2), and the shim binary it runs per container.
youki = ["rusternetes-kubelet/youki"]
# The etcd link over mutual TLS: --etcd-cafile/--etcd-certfile/--etcd-keyfile
# for a client, --serve-etcd-cert-file/--serve-etcd-key-file/
# --serve-etcd-client-ca-file for the served store.
etcd-tls = ["rusternetes-storage/etcd-tls", "tunnr-etcd?/tls", "dep:rustls"]
# Per-node limits on the served store (--serve-etcd-node-authz): a kubelet's
# client certificate CN=system:node:<node> writes only that node's objects.
etcd-authz = ["etcd-tls", "tunnr-etcd?/authz"]
# The served store as a Raft replica (tunnr-etcd feature raft): an HA control
# plane of three, --store-raft-id/--store-raft-peers, plus --leader-elect.
store-raft = ["redb", "tunnr-etcd?/raft"]

[dependencies]
rusternetes-api-server = { path = "../api-server" }
rusternetes-scheduler = { path = "../scheduler" }
rusternetes-controller-manager = { path = "../controller-manager" }
rusternetes-kubelet = { path = "../kubelet" }
rusternetes-kube-proxy = { path = "../kube-proxy" }
rusternetes-storage = { path = "../storage" }
rusternetes-common = { path = "../common" }
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
# The component heartbeats (Leases in kube-system, src/heartbeat.rs).
chrono.workspace = true
serde_json.workspace = true
# With `redb`: serve the embedded store to other nodes as etcd v3 (--serve-etcd).
tunnr-etcd = { version = "0.2", optional = true, features = ["server"] }
rustls = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
